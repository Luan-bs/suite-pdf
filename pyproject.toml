[project]
name = "suite-pdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luan Bitencourt Sarmento", email = "luanbitencourt57@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pymupdf>=2.0",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
]

[project.scripts]
suitepdf = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
